[package]
name = "awsr-difftest"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Differential test harness comparing awsr with the reference AWS CLI"
publish = false

[[bin]]
name = "awsr-difftest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
awsr = { path = ".." }
base64 = "0.23"
bytes = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.29", features = ["term", "fs", "signal", "process", "socket", "uio"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util", "fs"] }
