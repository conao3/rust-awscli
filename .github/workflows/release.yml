name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  version-bump:
    name: Version Bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - id: bump
        run: |
          CURRENT_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "awsr") | .version')
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          case "${{ inputs.version_bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ steps.bump.outputs.new_version }}\"/" Cargo.toml
          cargo check -p awsr
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.bump.outputs.new_version }}"

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [version-bump]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
            rustflags: -C target-feature=+crt-static
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            rustflags: -C target-feature=+crt-static
          - target: x86_64-apple-darwin
            os: macos-14
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            use-cross: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.version-bump.outputs.new_version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release -p awsr --target ${{ matrix.target }}
          else
            cargo build --release -p awsr --target ${{ matrix.target }}
          fi
        shell: bash
      - run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../awsr-${{ matrix.target }}.tar.gz awsr
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: awsr-${{ matrix.target }}
          path: awsr-${{ matrix.target }}.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-bump, build-binaries]
    if: ${{ !cancelled() && needs.version-bump.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          files: artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
