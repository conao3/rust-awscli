name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to crates.io
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail -o posix {0}

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in awsr-models awsr-models-services-a-l awsr-models-services-m-z awsr; do
            version=$(cargo metadata --format-version=1 --no-deps | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if curl -sf -A "awsr-publish (https://github.com/conao3/rust-awscli)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done
